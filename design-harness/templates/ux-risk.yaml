# UX risk rules, read by {{ux_risk_command}}.
# The highest matching class wins: test > review > none.
# Path rules are reliable from day one. Add change detectors as the
# classifier grows; each name below maps to one detector in the script.
version: 1

test:
  paths:                      # critical flows from the constitution
    - "{{src/features/checkout/**}}"
    - "{{src/features/account_recovery/**}}"
  changes:
    - new_route               # new screen, route or navigation entry
    - navigation_change       # menu, tabs, back behaviour, IA
    - removed_confirmation    # a confirm, undo or review step removed
    - critical_copy           # changed strings matching critical_terms
  critical_terms:             # case-insensitive, matched in changed strings
    - "{{price}}"
    - "{{fee}}"
    - "{{total}}"
    - "{{delete}}"
    - "{{consent}}"

review:
  paths:
    - "{{src/design_system/**}}"   # new or changed components
  changes:
    - new_component
    - layout_change           # visual baseline differs beyond tolerance
    - state_change            # empty, loading, error or success states
    - copy_change             # any other user-facing string

none:
  # Token-only or refactor diffs whose visual baselines match.
  baseline_tolerance: 0.0     # {{adjust to your visual test tool}}
